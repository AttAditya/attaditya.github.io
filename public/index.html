    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lexend:wght@100..900&family=Pacifico&display=swap');

      noscript {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 9999;
        background-color: #fff;
        color: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem;
        font-family: 'Lexend', 'JetBrains Mono', sans-serif;
        cursor: default;
      }

      noscript * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        cursor: default;
      }

      noscript .container {
        width: 100%;
        height: 100%;
        background-color: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #fff;
        gap: 1rem;
      }

      noscript .alert {
        width: min(50rem, 90vw);
        background-color: #f44336;
        color: #fff;
        padding: 1rem;
        border-radius: 0.5rem;
      }

      noscript .help {
        width: min(50rem, 90vw);
        background-color: #2196F3;
        color: #fff;
        padding: 1rem;
        border-radius: 0.5rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: center;
      }

      noscript .help a {
        background-color: #32B24E;
        text-decoration: none;
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        transition: background-color 0.3s ease;
        cursor: pointer;
      }

      noscript .help a:hover {
        background-color: #28a745;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="container">
        <h1>
          JavaScript is Disabled :/
        </h1>

        <div class="alert">
          I'm a solid developer, but I'm not a magician.
          I can't make this website work without JavaScript.
          So really, requesting you to enable JavaScript in your browser.
        </div>
        
        <div class="help">
          If you don't know how to enable JavaScript, please visit this link:
          <a href="https://www.enable-javascript.com/" target="_blank" rel="noopener noreferrer">
            How to enable JavaScript
          </a>
        </div>
      </div>
    </noscript>

    <div id="root"></div>
  </body>
